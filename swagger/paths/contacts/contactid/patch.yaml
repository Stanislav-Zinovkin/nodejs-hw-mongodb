tags:
  - Contacts
summary: Update a contact by ID
operationId: updateContact
description: Updates one or more fields of an existing contact
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    schema:
      type: string
    description: Unique ID of the contact
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
          phoneNumber:
            type: string
          email:
            type: string
          isFavourite:
            type: boolean
          contactType:
            type: string
            enum: [work, home, personal]
          photo:
            type: string
            format: binary
responses:
  '200':
    description: Contact updated successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact
            data:
              $ref: '../../../components/schemas/Contact.yaml'
  '400':
    description: Missing fields to update
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/ErrorResponse.yaml'
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/ErrorResponse.yaml'
