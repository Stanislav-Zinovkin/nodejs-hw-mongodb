tags:
  - Contacts
summary: Get a contact by ID
operationId: getContactById
description: Returns detailed information about a single contact by its unique ID
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    schema:
      type: string
    description: Unique ID of the contact
responses:
  '200':
    description: Contact found successfully
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/Contact.yaml'
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/ErrorResponse.yaml'
