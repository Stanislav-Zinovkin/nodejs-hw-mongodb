tags:
  - Contacts
summary: Get a contact by ID
operationId: getContactById
description: Returns a single contact by its unique ID
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    schema:
      type: string
    description: Unique ID of the contact
responses:
  '200':
    description: Contact found successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contact
            data:
              $ref: '../../../components/schemas/Contact.yaml'
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/ErrorResponse.yaml'
