tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Creates a new contact with provided data.
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
          phoneNumber:
            type: string
          email:
            type: string
          isFavourite:
            type: boolean
          contactType:
            type: string
            enum: [work, home, personal]
          photo:
            type: string
            format: binary
        required:
          - name
          - phoneNumber
          - contactType
responses:
  '201':
    description: Contact created successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact
            data:
              $ref: '../../components/schemas/Contact.yaml'
  '400':
    description: Invalid request data
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/ErrorResponse.yaml'
