tags: 
  - Contacts
summary: Update a contact by ID
operationId: updateContact
description: Updates one or more fields of an existing contact by its unique ID
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    schema:
      type: string
    description: Unique ID of the contact
requestBode:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../../components/schemas/Contact.yaml'
responses:
  '200':
    description: Contact updated successfully
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/Contact.yaml'
  '400':
    description: Invalid request data
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/ErrorResponse.yaml'
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/ErrorResponse.yaml'                                
